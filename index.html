(function(g){
const wk=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return Math.floor(x/6048e5)};
const st=x=>new Date(x.starts_at).getTime(),dur=x=>(+x.duration_min||60)*6e4;
const ended=(x,n)=>st(x)+dur(x)<n;
const live=(x,n)=>n>=st(x)-18e5&&n<=st(x)+dur(x)+72e5;
/* Streak = consecutive weeks the club met that the member checked in to.
   Every 4 attended weeks in a row earns a freeze (max 2) that covers one missed week. */
function calcStreak(sessions,K,n){
 const cnt=sessions.filter(x=>ended(x,n)||K.has(x.id)),
  E=[...new Set(cnt.map(x=>wk(x.starts_at)))].sort((a,b)=>a-b),
  A=new Set(cnt.filter(x=>K.has(x.id)).map(x=>wk(x.starts_at))),used=new Set();
 let run=0,best=0,fz=0,since=0;
 E.forEach(w=>{if(A.has(w)){run++;since++;if(since>=4&&fz<2){fz++;since=0}}else if(fz>0){fz--;used.add(w)}else{run=0;since=0}best=Math.max(best,run)});
 return{c:run,best,E,A,used,fz,total:A.size}}
function nextTarget(meetNext,sessions,n){
 const m=new Date(meetNext).getTime();if(!isNaN(m)&&m+36e5>=n)return{t:m,l:'Next meeting'};
 const s=sessions.filter(x=>!ended(x,n)).sort((a,b)=>a.starts_at.localeCompare(b.starts_at))[0];return s?{t:st(s),l:s.title}:null}
g.Core={wk,ended,live,calcStreak,nextTarget};if(typeof module!=='undefined'&&module.exports)module.exports=g.Core;
})(typeof window!=='undefined'?window:globalThis);

let lbFrom=null;const lbClose=()=>{const lb=$('#lb');lb.classList.remove('on');lbFrom?.focus()};

addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#lb').classList.contains('on'))lbClose()});
