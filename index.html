<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--tl)}h1,h2,h3{font-family:"Space Grotesk","Inter",system-ui,sans-serif;letter-spacing:-.02em;line-height:1.2;margin:0 0 .5rem}h2{font-size:1.7rem;color:var(--nv)}h3{color:var(--nv)}

nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:.25rem;align-items:center;padding:.4rem .75rem;overflow-x:auto}

.btn{display:inline-block;border:0;border-radius:999px;padding:.7rem 1.3rem;font:inherit;font-weight:700;background:var(--or);color:#fff;cursor:pointer;text-decoration:none}
.btn.g{background:transparent;border:2px solid currentColor;color:var(--tl)}.btn.s{padding:.35rem .8rem;font-size:.85rem}.hero .btn.g{color:#fff}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.hero{background:linear-gradient(135deg,#05080b,#1d4ed8 60%,#15803d);color:#fff;text-align:center;padding:4rem 1rem}.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700}.hero p{max-width:620px;margin:0 auto 1.5rem;font-size:1.15rem}.hero .btn{margin:.25rem}
.ann{background:var(--or);color:#fff;text-align:center;padding:.5rem 1rem;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1.1rem;margin-bottom:1rem}.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.grid .card{margin:0}
.mis{border-left:6px solid var(--or);font-size:1.2rem}.mt{background:#0b1f4d;color:#fff}.mt h3{color:#fff}.cd{font-size:1.7rem;font-weight:800}
.tag{display:inline-block;background:var(--bd);border-radius:999px;padding:.1rem .6rem;font-size:.8rem;margin:0 .3rem .3rem 0}.tag.f{background:var(--or);color:#fff}.tag.o{background:#d8f3e3;color:#0a5a2b}.tag.c{background:#ffe0dc;color:#9b1c10}
.off{opacity:.55}.mu{color:var(--mu)}
input,select,textarea{font:inherit;width:100%;padding:.5rem;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
label{display:block;font-size:.85rem;color:var(--mu);margin:.5rem 0}.ck{display:flex;gap:.4rem;align-items:center}.ck input{width:auto}
fieldset{border:1px solid var(--bd);border-radius:12px;margin:.6rem 0;padding:.6rem}
.fl{display:grid;gap:.5rem;grid-template-columns:2fr 1fr;margin-bottom:1rem}.stat{font-size:1.8rem;font-weight:800;color:var(--tl)}
details{margin:.4rem 0}summary{cursor:pointer;color:var(--tl);font-weight:600}
footer{background:#05080b;border-top:4px solid #15803d;color:#fff;padding:1.5rem 1rem;text-align:center;margin-top:2rem}footer a{color:#86efac}
</style>

<script>

const CFG={url:"https://byruajxdugwmwlarthzd.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5cnVhanhkdWd3bXdsYXJ0aHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNDM1MDMsImV4cCI6MjEwNjYxOTUwM30.SEcrcPqOYIBdA56SdZH5V1Z35m1OHOuU1_83FE8cgjU"};
/* ====================================================================================== */
const sb=CFG.url&&window.supabase?supabase.createClient(CFG.url,CFG.key):null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=u=>/^(https?:\/\/|mailto:)/i.test(String(u||'').trim())?esc(String(u).trim()):'#';
const fD=d=>d?new Date(d).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'',fDay=d=>d?new Date(d+'T12:00').toLocaleDateString(undefined,{dateStyle:'medium'}):'';
const gc=(t,s,m)=>{const f=d=>new Date(d).toISOString().replace(/[-:]|\.\d+/g,'');return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t)+'&dates='+f(s)+'/'+f(new Date(s).getTime()+m*6e4)};
const gcd=(t,d)=>{const n=new Date(d+'T12:00');n.setDate(n.getDate()+1);return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t)+'&dates='+d.replace(/-/g,'')+'/'+n.toISOString().slice(0,10).replace(/-/g,'')};
let S={site:{mission:"The Elgin STEM Society empowers students to explore science, technology, engineering, and math through hands-on learning, collaboration, and community.",about:"We are a student-run club in Elgin, Illinois. No experience needed.",values:"Curiosity, Teamwork, Inclusivity",announce_on:!sb,announce:"Demo mode: connect Supabase (see setup steps) to turn on accounts and editing."},meeting:{url:"",when:"Wednesdays, 6:00 PM",next:"",loc:"Online",id:"",pass:""},contacts:[{name:"Shankar Noone",role:"Co-founder",email:"shankarnoone@gmail.com"},{name:"Krishiv Mahadik",role:"Co-Founder",email:"Kmahadik@imsa.edu"}]};
let T={sessions:[],lessons:[],signups:[],events:[],pend:[]},me=null,prof=null,R=new Set(),F={s:'',q:'',ls:''},L={up:false};

const FD={Sessions:[['title'],['subject'],['host name'],['starts at','dt'],['meeting duration','num'],['description','area'],['link'],[' meeting recording']],lessons:[['title'],['subject'],['level'],['description','area'],['link'],['featured','chk']],signups:[['title'],['description','area'],['deadline','date'],['link'],['active','chk']],events:[['title'],['date','date'],['location']]};

async function load(){if(!sb)return;
 const q=t=>sb.from(t).select('*'),[st,a,b,c,d]=await Promise.all(['settings','sessions','lessons','signups','events'].map(q));
 (st.data||[]).forEach(r=>S[r.key]=r.value);T.sessions=a.data||[];T.lessons=b.data||[];T.signups=c.data||[];T.events=d.data||[];
 const{data:{session}}=await sb.auth.getSession();me=session?.user||null;prof=null;R=new Set();
 if(me){prof=(await sb.from('profiles').select('*').eq('id',me.id).single()).data;R=new Set(((await sb.from('rsvps').select('session_id').eq('user_id',me.id)).data||[]).map(r=>r.session_id))}}
const mail=s=>'mailto:'+S.contacts.map(c=>esc(c.email)).join(',')+'?subject='+encodeURIComponent(s);
function shell(){const N={sessions:'Sessions',lessons:'Lessons',signups:'Sign-Ups',events:'Events',contact:'Contact'};
 $('#ann').innerHTML=S.site.announce_on?`<div class="ann" role="status">${esc(S.site.announce)}</div>`:'';
 $('#nav').innerHTML='<b><a href="#/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:.5rem"><img src="logo.png" alt="Elgin STEM Society logo" style="height:32px;width:auto">Elgin STEM</a></b>'+Object.keys(N).map(k=>`<a href="#/${k}">${N[k]}</a>`).join('')+(me?`<a href="#/profile">${esc(prof?.name||'Profile')}</a>${isO()?'<a href="#/admin">Admin</a>':''}<button class="btn s g" data-a="out">Log out</button>`:'<a class="btn s" href="#/login">Log in</a>')+'<button class="btn s g" data-a="theme" aria-label="Toggle dark mode">◐</button>';
 $('#foot').innerHTML=`<p><b>Elgin STEM Society</b> · Elgin, IL</p><p>${S.contacts.map(c=>`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`).join(' · ')}</p><p>© ${new Date().getFullYear()}</p>`}
const scard=(x,p)=>`<div class="card ${p?'off':''}"><span class="tag">${esc(x.subject)}</span><span class="tag">${fD(x.starts_at)}</span><h3>${esc(x.title)}</h3><p class="mu">Led by ${esc(x.host_name)} · ${+x.duration_min||60} min</p><p>${esc(x.description)}</p>`+
 (p?(x.recording?`<a class="btn s" href="${U(x.recording)}" target="_blank" rel="noopener">Watch recording</a>`:''):
 (!me?'<a class="btn s" href="#/login">Log in to RSVP</a>':`<button class="btn s ${R.has(x.id)?'g':''}" data-a="rsvp" data-id="${x.id}">${R.has(x.id)?'Cancel RSVP':'RSVP'}</button> ${R.has(x.id)&&x.link?`<a class="btn s" href="${U(x.link)}" target="_blank" rel="noopener">Join session</a>`:''} <a class="btn s g" href="${gc(x.title,x.starts_at,+x.duration_min||60)}" target="_blank" rel="noopener">Add to calendar</a>`))+
 (me&&(x.host_id==me.id||isO())?` <button class="btn s g" data-a="delsess" data-id="${x.id}">Delete</button>`:'')+'</div>';
const fld=([k,t],v)=>{const a=`data-k="${k}" data-t="${t||''}"`;if(t=='chk')return`<label class="ck"><input type="checkbox" ${v?'checked':''} ${a}> ${k}</label>`;
 if(t=='area')return`<label>${k}<textarea rows="3" ${a}>${esc(v)}</textarea></label>`;
 if(t=='dt'&&v){const d=new Date(v);if(!isNaN(d))v=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)}
 return`<label>${k}<input type="${{date:'date',dt:'datetime-local',num:'number'}[t]||'text'}" value="${esc(v)}" ${a}></label>`};
const collect=el=>{const o={};el.querySelectorAll('[data-k]').forEach(i=>{let v=i.type=='checkbox'?i.checked:i.value,t=i.dataset.t;if(t=='dt')v=v?new Date(v).toISOString():null;else if(t=='num')v=+v||0;else if(t=='date'&&!v)v=null;o[i.dataset.k]=v});return o};
const crud=tb=>`<h3 style="margin-top:1.5rem">${tb}</h3>`+T[tb].map(r=>`<fieldset data-f="${tb}" data-id="${r.id}">${FD[tb].map(f=>fld(f,r[f[0]])).join('')}<button class="btn s" data-a="save">Save</button> <button class="btn s g" data-a="del">Delete</button></fieldset>`).join('')+`<button class="btn s" data-a="add" data-t="${tb}">+ Add</button>`;
const P={};
P.home=()=>{const m=S.meeting,up=T.sessions.filter(x=>new Date(x.starts_at)>=Date.now()).sort((a,b)=>a.starts_at.localeCompare(b.starts_at)).slice(0,3);
 return`<header class="hero"><h1 style="display:flex;align-items:center;justify-content:center;gap:.75rem;flex-wrap:wrap"><img src="logo.png" alt="Elgin STEM Society logo" style="height:1.2em;width:auto">Elgin STEM Society</h1><p>Free, student-led STEM sessions in Elgin, Illinois. Learn something new, or teach what you love.</p><a class="btn" href="#/sessions">Browse sessions</a>${m.url?`<a class="btn g" href="${U(m.url)}" target="_blank" rel="noopener">Join a meeting</a>`:''}${me?'':'<a class="btn g" href="#/login">Join us</a>'}</header>
<section><h2>Our Mission</h2><div class="card mis">${esc(S.site.mission)}</div><p>${esc(S.site.about)}</p>${String(S.site.values).split(',').map(v=>`<span class="tag f">${esc(v.trim())}</span>`).join('')}</section>
<section><h2>Meetings</h2><div class="card mt"><h3>${esc(m.when)}</h3><p>${esc(m.loc)}</p><div class="cd" id="cd"></div><p>Meeting ID: <b>${esc(m.id)}</b> · Passcode: <b>${esc(m.pass)}</b></p><a class="btn" href="${U(m.url)}" target="_blank" rel="noopener">Join Now</a> <button class="btn g s" style="color:#fff" data-a="copy">Copy link</button></div></section>
<section><h2>Upcoming sessions</h2>${up.length?`<div class="grid">${up.map(x=>scard(x,0)).join('')}</div>`:'<p class="mu">No upcoming sessions yet.</p>'}</section>
<section><h2>FAQ</h2>${FAQ.map(f=>`<details class="card"><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</section>`};
P.sessions=()=>{const L2=T.sessions.filter(x=>!F.s||x.subject==F.s),n=Date.now(),up=L2.filter(x=>new Date(x.starts_at)>=n).sort((a,b)=>a.starts_at.localeCompare(b.starts_at)),pa=L2.filter(x=>new Date(x.starts_at)<n).sort((a,b)=>b.starts_at.localeCompare(a.starts_at));
 const subs=[...new Set(T.sessions.map(x=>x.subject).filter(Boolean))];
 const host=canHost()?`<div class="card" id="hf"><h3>Host a session</h3>${FD.sessions.filter(f=>!['host_name','recording'].includes(f[0])).map(f=>fld(f,f[0]=='duration_min'?60:'')).join('')}<button class="btn s" data-a="post">Post session</button></div>`:
 me?(prof?.tutor_requested?'<div class="card">Your tutor request is pending officer approval.</div>':'<div class="card"><h3>Want to teach?</h3><p>Apply to become a tutor. An officer will review your request.</p><button class="btn s" data-a="treq">Apply to be a tutor</button></div>'):'<div class="card"><a href="#/login">Log in</a> to RSVP or apply to host.</div>';
 return`<section><h2>Sessions</h2><select id="fs" aria-label="Subject filter"><option value="">All subjects</option>${subs.map(s=>`<option ${s==F.s?'selected':''}>${esc(s)}</option>`).join('')}</select><br><br>${up.length?`<div class="grid">${up.map(x=>scard(x,0)).join('')}</div>`:'<p class="mu">No upcoming sessions.</p>'}${pa.length?`<h3 style="margin-top:1.5rem">Past sessions</h3><div class="grid">${pa.map(x=>scard(x,1)).join('')}</div>`:''}<br>${host}</section>`};
const lcard=x=>`<article class="card">${x.featured?'<span class="tag f">Featured</span>':''}<span class="tag">${esc(x.subject)}</span><span class="tag">${esc(x.level)}</span><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${x.link?`<a class="btn s" href="${U(x.link)}" target="_blank" rel="noopener">Open lesson</a>`:''}</article>`;
function lessonList(){const q=F.q.toLowerCase();$('#ll').innerHTML=T.lessons.filter(x=>(!F.ls||x.subject==F.ls)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).sort((a,b)=>!!b.featured-!!a.featured||String(b.created_at).localeCompare(String(a.created_at))).map(lcard).join('')||'<p class="mu">No lessons found.</p>'}
P.lessons=()=>`<section><h2>Lesson Plans</h2><div class="fl"><input id="lq" placeholder="Search lessons" aria-label="Search lessons" value="${esc(F.q)}"><select id="ls" aria-label="Subject"><option value="">All</option>${[...new Set(T.lessons.map(x=>x.subject).filter(Boolean))].map(s=>`<option ${s==F.ls?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div id="ll"></div><h3>Resources</h3><ul>${RES.map(r=>`<li><a href="${r[1]}" target="_blank" rel="noopener">${r[0]}</a></li>`).join('')}</ul></section>`;
P.signups=()=>`<section><h2>Sign-Ups</h2><div class="grid">${T.signups.map(s=>{const o=s.active&&(!s.deadline||new Date(s.deadline+'T23:59:59')>=new Date());return`<div class="card ${o?'':'off'}"><span class="tag ${o?'o':'c'}">${o?'Open':'Closed'}</span><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><p class="mu">Deadline: ${fDay(s.deadline)}</p>${o?`<a class="btn s" href="${U(s.link)}" target="_blank" rel="noopener">Sign up</a>`:''}</div>`}).join('')||'<p class="mu">Nothing open right now.</p>'}</div></section>`;
P.events=()=>`<section><h2>Events</h2><div class="grid">${T.events.map(e=>`<div class="card"><h3>${esc(e.title)}</h3><p class="mu">${fDay(e.date)} · ${esc(e.location)}</p>${e.date?`<a class="btn s g" href="${gcd(e.title,e.date)}" target="_blank" rel="noopener">Add to Google Calendar</a>`:''}</div>`).join('')}</div></section>`;
P.contact=()=>`<section><h2>Contact</h2><div class="grid">${S.contacts.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><p class="mu">${esc(c.role)}</p><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`).join('')}</div><div class="card"><h3>Send a message</h3><label>Your name<input id="cn"></label><label>Message<textarea id="cm" rows="4"></textarea></label><button class="btn" data-a="send">Send email</button></div></section>`;
P.login=()=>`<section><div class="card" style="max-width:420px;margin:auto"><h2>${L.up?'Create account':'Log in'}</h2>${L.up?'<label>Name<input id="ln" autocomplete="name"></label>':''}<label>Email<input id="le" type="email" autocomplete="email"></label><label for="lp">Password</label><div style="display:flex;gap:.4rem"><input id="lp" type="password" autocomplete="${L.up?'new-password':'current-password'}"><button type="button" class="btn s g" data-a="eye" aria-label="Show or hide password">Show</button></div><p><button class="btn" data-a="auth">${L.up?'Sign up':'Log in'}</button> <button class="btn s g" data-a="mode">${L.up?'I have an account':'Create an account'}</button></p><p class="mu">Your name is visible to other logged-in members. Share only what you are comfortable with.</p></div></section>`;
P.profile=()=>{if(!me)return P.login();const n=Date.now(),mine=T.sessions.filter(x=>x.host_id==me.id&&new Date(x.starts_at)<n),att=T.sessions.filter(x=>R.has(x.id)&&new Date(x.starts_at)<n);
 return`<section><h2>My Profile</h2><span class="tag f">${esc(prof?.role)}</span><div class="grid" style="margin:1rem 0"><div class="card"><div class="stat">${att.length}</div>sessions attended</div><div class="card"><div class="stat">${mine.length}</div>sessions taught</div><div class="card"><div class="stat">${(mine.reduce((a,x)=>a+(+x.duration_min||60),0)/60).toFixed(1)}</div>hours taught</div></div>
 <div class="card" id="pf"><label>Name<input data-k="name" value="${esc(prof?.name)}"></label><label>Subjects you know<input data-k="subjects" value="${esc(prof?.subjects)}"></label><label>Short bio<textarea rows="3" data-k="bio">${esc(prof?.bio)}</textarea></label><button class="btn s" data-a="saveprof">Save profile</button></div></section>`};
P.admin=()=>!isO()?'<section><p>Officers only.</p></section>':`<section><h2>Officer Admin</h2><p class="mu">Everything here updates the live site for all visitors.</p><h3>Tutor requests</h3>${T.pend.map(p=>`<div class="card">${esc(p.name)} <button class="btn s" data-a="appr" data-id="${p.id}">Approve as tutor</button></div>`).join('')||'<p class="mu">None right now.</p>'}
 <h3>Mission &amp; announcement</h3><fieldset data-f="settings" data-key="site">${FS.site.map(f=>fld(f,S.site[f[0]])).join('')}<button class="btn s" data-a="saveset">Save</button></fieldset>
 <h3>Meeting link</h3><fieldset data-f="settings" data-key="meeting">${FS.meeting.map(f=>fld(f,S.meeting[f[0]])).join('')}<button class="btn s" data-a="saveset">Save</button></fieldset>
 <h3>Contacts</h3>${S.contacts.map((c,i)=>`<fieldset data-f="contact">${FC.map(f=>fld(f,c[f[0]])).join('')}<button class="btn s g" data-a="rmc" data-i="${i}">Remove</button></fieldset>`).join('')}<button class="btn s g" data-a="addc">+ Add contact</button> <button class="btn s" data-a="savec">Save contacts</button>${['sessions','lessons','signups','events'].map(crud).join('')}</section>`;
async function route(){const r=location.hash.slice(2)||'home';if(r=='admin'&&isO())T.pend=(await sb.from('profiles').select('*').eq('tutor_requested',true).eq('role','member')).data||[];
 $('#main').innerHTML=(P[r]||P.home)();if(r=='lessons')lessonList();tick();scrollTo(0,0)}
function tick(){const e=$('#cd');if(!e)return;const t=new Date(S.meeting.next)-Date.now();e.textContent=isNaN(t)?'':t<=0?'Next meeting: see schedule':`Next meeting in ${Math.floor(t/864e5)}d ${Math.floor(t/36e5)%24}h ${Math.floor(t/6e4)%60}m ${Math.floor(t/1e3)%60}s`}
document.addEventListener('input',e=>{const t=e.target;if(t.id=='fs'){F.s=t.value;route()}else if(t.id=='lq'){F.q=t.value;lessonList()}else if(t.id=='ls'){F.ls=t.value;lessonList()}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,fs=t.closest('fieldset');
 if(a=='theme'){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;return void(r.dataset.theme=d?'light':'dark')}
 if(a=='copy')return void(navigator.clipboard?.writeText(S.meeting.url).then(()=>{t.textContent='Copied!'}));
 if(a=='send')return void(location.href=mail('Message from '+($('#cn').value||'website visitor'))+'&body='+encodeURIComponent($('#cm').value));
 if(a=='mode'){L.up=!L.up;return route()}
if(a=='eye'){const p=$('#lp'),h=p.type=='password';p.type=h?'text':'password';t.textContent=h?'Hide':'Show';return}
 if(!sb)return alert('Demo mode: add your Supabase URL and key at the top of index.html first.');
 const ok=r=>r.error?(alert(r.error.message),0):1,done=async()=>{await load();shell();route()};
 if(a=='auth'){const em=$('#le').value,pw=$('#lp').value,r=L.up?await sb.auth.signUp({email:em,password:pw,options:{data:{name:$('#ln').value}}}):await sb.auth.signInWithPassword({email:em,password:pw});
  if(!ok(r))return;if(L.up&&!r.data.session)return alert('Check your email to confirm your account, then log in.');await load();shell();location.hash='#/profile';return route()}
 if(a=='out'){await sb.auth.signOut();location.hash='#/';return done()}
 if(a=='rsvp')return ok(R.has(id)?await sb.from('rsvps').delete().match({session_id:id,user_id:me.id}):await sb.from('rsvps').insert({session_id:id}))&&done();
 if(a=='post'){const o=collect($('#hf'));if(!o.title||!o.starts_at)return alert('Add a title and date/time.');o.host_name=prof.name;return ok(await sb.from('sessions').insert(o))&&done()}
 if(a=='delsess'&&confirm('Delete this session?'))return ok(await sb.from('sessions').delete().eq('id',id))&&done();
 if(a=='treq')return ok(await sb.from('profiles').update({tutor_requested:true}).eq('id',me.id))&&done();
 if(a=='saveprof')return ok(await sb.from('profiles').update(collect($('#pf'))).eq('id',me.id))&&done();
 if(a=='appr')return ok(await sb.from('profiles').update({role:'tutor',tutor_requested:false}).eq('id',id))&&done();
 if(a=='saveset')return ok(await sb.from('settings').upsert({key:fs.dataset.key,value:collect(fs)}))&&(alert('Saved!'),done());
 if(a=='save')return ok(await sb.from(fs.dataset.f).update(collect(fs)).eq('id',fs.dataset.id))&&alert('Saved!');
 if(a=='del'&&confirm('Delete this item?'))return ok(await sb.from(fs.dataset.f).delete().eq('id',fs.dataset.id))&&done();
 if(a=='add'){const tb=t.dataset.t;return ok(await sb.from(tb).insert(tb=='sessions'?{title:'New session',starts_at:new Date().toISOString(),host_name:prof.name}:{title:'New item'}))&&done()}
 const cs=()=>[...document.querySelectorAll('[data-f=contact]')].map(collect);
 if(a=='addc'){S.contacts=[...cs(),{name:'',role:'',email:''}];return route()}
 if(a=='rmc'){S.contacts=cs();S.contacts.splice(+t.dataset.i,1);return route()}
 if(a=='savec')return ok(await sb.from('settings').upsert({key:'contacts',value:cs()}))&&(alert('Saved!'),done())});
addEventListener('hashchange',route);
(async()=>{await load();shell();route();setInterval(tick,1000)})();
</script>
</body>
</html>
</html>
