(function(g){
const wk=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return Math.floor(x/6048e5)};
const st=x=>new Date(x.starts_at).getTime(),dur=x=>(+x.duration_min||60)*6e4;
const ended=(x,n)=>st(x)+dur(x)<n;
const live=(x,n)=>n>=st(x)-18e5&&n<=st(x)+dur(x)+72e5;
/* Streak = consecutive weeks the club met that the member checked in to.
   Every 4 attended weeks in a row earns a freeze (max 2) that covers one missed week. */
function calcStreak(sessions,K,n){
 const cnt=sessions.filter(x=>ended(x,n)||K.has(x.id)),
  E=[...new Set(cnt.map(x=>wk(x.starts_at)))].sort((a,b)=>a-b),
  A=new Set(cnt.filter(x=>K.has(x.id)).map(x=>wk(x.starts_at))),used=new Set();
 let run=0,best=0,fz=0,since=0;
 E.forEach(w=>{if(A.has(w)){run++;since++;if(since>=4&&fz<2){fz++;since=0}}else if(fz>0){fz--;used.add(w)}else{run=0;since=0}best=Math.max(best,run)});
 return{c:run,best,E,A,used,fz,total:A.size}}
function nextTarget(meetNext,sessions,n){
 const m=new Date(meetNext).getTime();if(!isNaN(m)&&m+36e5>=n)return{t:m,l:'Next meeting'};
 const s=sessions.filter(x=>!ended(x,n)).sort((a,b)=>a.starts_at.localeCompare(b.starts_at))[0];return s?{t:st(s),l:s.title}:null}
g.Core={wk,ended,live,calcStreak,nextTarget};if(typeof module!=='undefined'&&module.exports)module.exports=g.Core;
})(typeof window!=='undefined'?window:globalThis);

 }
 else if(a=='delevent'&&sb&&isO()){if(confirm('Delete event?')){await sb.from('events').delete().eq('id',id);toast('Event deleted');route();}}
 else if(a=='apprhour'&&sb&&isO()){await sb.from('service_hours').update({status:'approved'}).eq('id',id);toast('Hours approved');route();}
 else if(a=='rejhour'&&sb&&isO()){await sb.from('service_hours').update({status:'rejected'}).eq('id',id);toast('Hours rejected');route();}
 else if(a=='editevent'&&sb&&isO()){
  const ev=id=='new'?{title:'',date:new Date().toISOString().slice(0,10),location:'',description:'',link:''}:T.events.find(x=>x.id==id);
  const m=$('#md');
  m.innerHTML=`<div class="box"><h3>${id=='new'?'Add Event':'Edit Event'}</h3><form id="efm">${Object.keys(FD.events).map(k=>`<label>${lab(FD.events[k][0])}<input name="${FD.events[k][0]}" value="${esc(ev[FD.events[k][0]]||'')}" ${FD.events[k][1]=='date'?'type="date"':''}></label>`).join('')}<div class="row"><button class="btn s g" type="button" data-d="0">Cancel</button><button class="btn s" data-d="1">Save</button></div></form></div>`;
  m.classList.add('on');
  m.onclick=async sube=>{
   if(sube.target.closest('[data-d="0"]')){m.classList.remove('on');}
   if(sube.target.closest('[data-d="1"]')){
    sube.preventDefault();const fd=new FormData($('#efm'));const obj={};fd.forEach((v,k)=>obj[k]=v);
    if(id=='new')await sb.from('events').insert(obj);else await sb.from('events').update(obj).eq('id',id);
    m.classList.remove('on');toast('Saved!');loadRest().then(()=>route());
   }
  };
 }
 else if(a=='checkin'&&sb&&me){
  const code=await dlg('Enter live 4-digit host code:',{input:true,ok:'Check in'});
  if(!code)return;
  const r=await sb.rpc('check_in',{sid:id,code_entered:code});
  if(r.error)toast('Check-in failed: '+r.error.message);else{toast('Checked in! Streak updated.');K.add(id);route();}
 }
 else if(a=='code'&&sb&&isO()){showCode(id);}
 else if(a=='rsvp'&&sb&&me){
  if(R.has(id)){await sb.from('rsvps').delete().eq('session_id',id).eq('user_id',me.id);R.delete(id);toast('RSVP cancelled');}
  else{await sb.from('rsvps').insert({session_id:id,user_id:me.id});R.add(id);toast('RSVP confirmed!');}
  route();
 }
};

document.onsubmit=async e=>{
 e.preventDefault();const f=e.target;
 if(f.id=='lf'){const em=f.email.value;if(sb){await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+BASE}});toast('Check your email for the login link!');}}
 if(f.id=='hform'&&sb&&me){
  const fd=new FormData(f);
  await sb.from('service_hours').insert({user_id:me.id,user_name:prof?.name||me.email,title:fd.get('title'),hours:parseFloat(fd.get('hours')),video_url:fd.get('video_url')});
  toast('Service hours submitted successfully!');f.reset();loadRest().then(()=>route());
 }
};

window.onpopstate=route;
addEventListener('DOMContentLoaded',async()=>{await syncTime();await load();route();window.history.replaceState({},'',location.href);});
</script>
</body>
