 if(a=='rm'){const m=T.mem.find(x=>x.id==id);if(m?.role=='cofounder')return alert('Co-founders cannot be removed.');if(!confirm('Permanently remove '+(m?.name||m?.email||'this member')+'? Their account, RSVPs and poll answers will be deleted.'))return;const r=await sb.rpc('remove_member',{uid:id});if(!ok(r))return;T.mem=T.mem.filter(x=>x.id!=id);return memList()}
 if(a=='rej'){if(!confirm('Reject this tutor request?'))return;return ok(await sb.from('profiles').update({tutor_requested:false}).eq('id',id))&&done()}
 if(a=='csvm')return csv([['Name','Email','Role','Joined'],...T.mem.map(m=>[m.name,m.email,m.role,String(m.created_at).slice(0,10)])],'members.csv');
 if(a=='csva'){const sn=Object.fromEntries(T.sessions.map(s=>[s.id,s]));return csv([['Session','Date','Member (checked in)'],...T.chk.map(r=>[sn[r.session_id]?.title,String(sn[r.session_id]?.starts_at||'').slice(0,10),r.profiles?.name])],'attendance.csv')}
 if(a=='copye')return navigator.clipboard.writeText(T.mem.map(m=>m.email).join(', ')).then(()=>{t.textContent='Copied!'});
 if(a=='appr')return ok(await sb.from('profiles').update({role:'tutor',tutor_requested:false}).eq('id',id))&&done();
 if(a=='saveset')return ok(await sb.from('settings').upsert({key:fs.dataset.key,value:collect(fs)}))&&(alert('Saved!'),done());
 if(a=='save')return ok(await sb.from(fs.dataset.f).update(collect(fs)).eq('id',fs.dataset.id))&&alert('Saved!');
 if(a=='del'&&confirm('Delete this item?'))return ok(await sb.from(fs.dataset.f).delete().eq('id',fs.dataset.id))&&done();
 if(a=='add'){const tb=t.dataset.t;return ok(await sb.from(tb).insert(tb=='sessions'?{title:'New session',starts_at:new Date().toISOString(),host_name:prof.name}:{title:'New item'}))&&done()}
 const cs=()=>[...document.querySelectorAll('[data-f=contact]')].map(collect);
 if(a=='addc'){S.contacts=[...cs(),{name:'',role:'',email:''}];return route()}
 if(a=='rmc'){S.contacts=cs();S.contacts.splice(+t.dataset.i,1);return route()}
 if(a=='savec')return ok(await sb.from('settings').upsert({key:'contacts',value:cs()}))&&(alert('Saved!'),done())});
/* Logo lightbox with keyboard support */
let lbFrom=null;const lbClose=()=>{const lb=$('#lb');lb.classList.remove('on');lbFrom?.focus()};
document.addEventListener('click',e=>{const lb=$('#lb');if(e.target.closest('#lb'))return void lbClose();const im=e.target.closest('img[src="logo.png"]');if(im){e.preventDefault();lbFrom=im.closest('a')||document.activeElement;lb.querySelector('img').src=im.src;lb.classList.add('on');lb.focus()}});
addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#lb').classList.contains('on'))lbClose()});
addEventListener('hashchange',route);
try{const v=localStorage.getItem('th');if(v)document.documentElement.dataset.theme=v}catch(e){}
$('#main').innerHTML='<section><p class="mu">Loading…</p></section>';
