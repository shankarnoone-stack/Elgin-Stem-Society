<script id="core">
(function(g){
const wk=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return Math.floor(x/6048e5)};
const st=x=>new Date(x.starts_at).getTime(),dur=x=>(+x.duration_min||60)*6e4;
const ended=(x,n)=>st(x)+dur(x)<n;
const live=(x,n)=>n>=st(x)-18e5&&n<=st(x)+dur(x)+72e5;
function calcStreak(sessions,K,n){
 const cnt=sessions.filter(x=>ended(x,n)||K.has(x.id)),
 E=[...new Set(cnt.map(x=>wk(x.starts_at)))].sort((a,b)=>a-b),
 A=new Set(cnt.filter(x=>K.has(x.id)).map(x=>wk(x.starts_at))),used=new Set();
 let run=0,best=0,fz=0,since=0;
 E.forEach(w=>{if(A.has(w)){run++;since++;if(since>=4&&fz<2){fz++;since=0}}else if(fz>0){fz--;used.add(w)}else{run=0;since=0}best=Math.max(best,run)});
 return{c:run,best,total:A.size}}
function nextTarget(meetNext,sessions,n){
 const m=new Date(meetNext).getTime();if(!isNaN(m)&&m+36e5>=n)return{t:m,l:'Next meeting'};
 const s=sessions.filter(x=>!ended(x,n)).sort((a,b)=>a.starts_at.localeCompare(b.starts_at))[0];return s?{t:st(s),l:s.title}:null}
g.Core={wk,ended,live,calcStreak,nextTarget};
})(typeof window!=='undefined'?window:globalThis);
</script>

function renderContact(){
 return `<section><div class="sh"><h2>Contact Us</h2><p class="mu">Get in touch with club leadership.</p></div><div class="grid">
 ${S.contacts.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><p class="mu">${esc(c.role)}</p><p><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p></div>`).join('')}
 </div></section>`;
}

function renderLogin(){
 return `<section style="max-width:440px;margin:2rem auto;"><div class="sh" style="text-align:center;"><h2>Log In / Sign Up</h2></div><div class="card">
 <form id="lform"><label>Email Address</label><input type="email" id="lemail" required placeholder="you@example.com">
 <div style="margin-top:1rem;"><button type="submit" class="btn" style="width:100%;">Send Magic Link</button></div></form></div></section>`;
}

function renderProfile(){
 const streak=Core.calcStreak(T.sessions,K,now());
 return `<section style="max-width:640px;margin:0 auto;"><div class="sh"><h2>My Profile</h2><p class="mu">${esc(prof?.name||me?.email||'Member')} &bull; <span class="tag f">${esc(RL[prof?.role]||'Member')}</span></p></div>
 <div class="grid"><div class="card"><h3>Attendance Streak</h3><div class="stat" style="color:var(--or);">${streak.c} Weeks</div></div></div></section>`;
}

function renderAdmin(){
 if(!isO())return `<section><p>Access denied. Officers only.</p></section>`;
 return `
 <section>
  <div class="sh">
   <h2>Dynamic Events Admin Panel</h2>
   <p class="mu">Add or update community events instantly without touching the code.</p>
  </div>
  <div class="card" style="max-width:600px;margin-bottom:2rem;">
   <h3>Add New Event</h3>
   <form id="eform">
    <label>Event Title</label>
    <input type="text" id="etitle" required placeholder="Spring Science Fair">
    <label>Date</label>
    <input type="date" id="edate" required>
    <label>Location</label>
    <input type="text" id="eloc" required placeholder="Elgin Public Library">
    <label>Description</label>
    <textarea id="edesc" required placeholder="Details about the event..."></textarea>
    <label>Link (Optional)</label>
    <input type="url" id="elink" placeholder="https://...">
    <div style="margin-top:1rem;"><button type="submit" class="btn">Publish Event</button></div>
   </form>
  </div>
 </section>`;
}

function route(){
 AT=cur(); if(AT==='')AT='ov';
 renderNav(); renderAnn();
 const main=$('#main');
 switch(AT){
  case 'ov': main.innerHTML=renderOverview(); break;
  case 'sessions': main.innerHTML=renderSessions(); break;
  case 'lessons': main.innerHTML=renderLessons(); break;
  case 'signups': main.innerHTML=renderSignups(); break;
  case 'events': main.innerHTML=renderEvents(); break;
  case 'hours': main.innerHTML=renderHours(); break;
  case 'polls': main.innerHTML=renderPolls(); break;
  case 'contact': main.innerHTML=renderContact(); break;
  case 'login': main.innerHTML=renderLogin(); break;
  case 'profile': main.innerHTML=renderProfile(); break;
  case 'admin': main.innerHTML=renderAdmin(); break;
  default: main.innerHTML=renderOverview(); break;
 }
 window.scrollTo(0,0); bindEvents();
}

function bindEvents(){
 document.querySelectorAll('a[href^="#/"]').forEach(a=>{
  a.onclick=e=>{e.preventDefault();history.pushState({},'',BASE+a.getAttribute('href').slice(2));route();};
 });
 const lform=$('#lform');
 if(lform){
  lform.onsubmit=async e=>{
   e.preventDefault();
   const email=$('#lemail').value;
   if(sb){const {error}=await sb.auth.signInWithOtp({email});if(error)toast(error.message);else toast('Check your email for the login link!');}
   else{me={id:'demo'};prof={name:'Demo Student',role:'tutor'};toast('Logged in as demo user.');route();}
  };
 }
 const hform=$('#hform');
 if(hform){
  hform.onsubmit=async e=>{
   e.preventDefault();
   const activity=$('#htitle').value, hours=parseFloat($('#hnum').value), video_url=$('#hvideo').value;
   if(sb){
    const {error}=await sb.from('hours').insert({user_id:me.id,user_name:prof?.name||me.email,hours,activity,video_url,status:'pending'});
    if(error)toast(error.message);else{toast('Service hours submitted for review!');location.reload();}
   }else{
    T.hours.unshift({id:Date.now(),user_name:'Demo Student',hours,activity,video_url,status:'pending'});
    toast('Demo hours submitted!');route();
   }
  };
 }
 const eform=$('#eform');
 if(eform){
  eform.onsubmit=async e=>{
   e.preventDefault();
   const title=$('#etitle').value, date=$('#edate').value, location=$('#eloc').value, description=$('#edesc').value, link=$('#elink').value;
   if(sb){
    const {error}=await sb.from('dynamic_events').insert({title,date,location,description,link});
    if(error)toast(error.message);else{toast('Event published successfully!');location.reload();}
   }else{
    T.devents.unshift({id:Date.now(),title,date,location,description,link});
    toast('Demo event added!');route();
   }
  };
 }
}

window.onpopstate=()=>route();
async function init(){await load();route();$('#foot').innerHTML=`<div class="fcols"><div><b class="fb">Elgin STEM Society</b><p class="mu">Free student-led STEM education in Elgin, IL.</p></div></div><div class="fbot"><div>&copy; 2026 Elgin STEM Society</div></div>`;}
init();
</script>
</body>
</html>
